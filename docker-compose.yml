version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracex-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./tracex.db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=tracex2026
      - SECRET_KEY=tracex-production-secret-sih26151
    depends_on:
      - neo4j
    volumes:
      - ./backend/tracex.db:/app/tracex.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracex-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  neo4j:
    image: neo4j:5.18-community
    container_name: tracex-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/tracex2026
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
