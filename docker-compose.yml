services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracex-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/tracex.db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-DEV_NEO4J_PASSWORD_SIH26151}
      - SECRET_KEY=${SECRET_KEY:-DEV_SECRET_KEY_FOR_LOCAL_SIH_DEMO_ONLY_NOT_PROD}
      - ENABLE_REAL_TRANSFORMER=${ENABLE_REAL_TRANSFORMER:-true}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracex-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  neo4j:
    image: neo4j:5.18-community
    container_name: tracex-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-DEV_NEO4J_PASSWORD_SIH26151}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - neo4j_data:/data

volumes:
  sqlite_data:
  neo4j_data:
